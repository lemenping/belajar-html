<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Embeds — SMK Taruna Jaya Prawira Tuban</title>
  <style>
    iframe { max-width: 100%; display: block; margin: 1rem auto; }
  </style>
</head>
<body>
  <!-- YouTube embed (use the /embed/ URL form) -->
  <iframe
    width="560" height="315"
    src="https://www.youtube.com/embed/dITgB0eG4mI"
    title="YouTube video player"
    frameborder="0"
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
    allowfullscreen
    loading="lazy">
  </iframe>

  <!-- Google Maps embed (search -> output=embed) -->
  <iframe
    width="600" height="450"
    src="https://www.google.com/maps?q=SMK+Taruna+Jaya+Prawira+Tubans&output=embed"
    title="SMK Taruna Jaya Prawira Tuban — Google Maps"
    style="border:0;"
    allowfullscreen
    loading="lazy">
  </iframe>
</body>
</html>
